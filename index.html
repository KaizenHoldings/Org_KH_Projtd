<script id="view-state" type="application/json">{"focus":null,"openPath":[]}</script>
<script>
(() => {
 'use strict';
 const data=JSON.parse(document.getElementById('org-data').textContent),root=data.tree,general=root.children[0],branches=general.children;
 const nodes=new Map(),parents=new Map();
 function visit(n,parent){nodes.set(n.id,n);if(parent)parents.set(n.id,parent.id);n.children.forEach(c=>visit(c,n))}visit(root);
 const initial=JSON.parse(document.getElementById('view-state').textContent);
 let focus=branches.some(n=>n.id===initial.focus)?initial.focus:null,openPath=[];
 // A single open path keeps ancestors visible while closing every other branch.
 function pathTo(id){const path=[];let n=nodes.get(id);while(n&&n.id!==focus){path.unshift(n.id);n=nodes.get(parents.get(n.id))}return n?path:[]}
 if(focus){for(const id of initial.openPath||[]){const path=pathTo(id);if(path.length&&nodes.get(id).children.length)openPath=path}}
 const stage=document.getElementById('stage'),viewport=document.getElementById('viewport');
 const escape=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const title=n=>n.title.replace(/\s+/g,' ').trim().replace('INTEGRADOR GERENTE GENERAL','Integrador · Gerente General').replace('COORDINADOR LEGAL','Coordinador Legal').replace('Gerente LEGAL','Gerente Legal');
 const chevron='<svg class="chevron" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="m4 6 4 4 4-4"/></svg>';
 const enterIcon='<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 4h9v9M16 4 5 15"/></svg>';
 function status(n){return n.nodeType==='POSICIÓN'?'':`<span class="status ${n.nodeType==='PROYECTADO'?'projected':''}">${n.nodeType==='PROYECTADO'?'Proyectado':'Vacante'}</span>`}
 function content(n){return `<span class="title">${escape(title(n))}</span><span class="person">${escape(n.subtitle.trim())}</span>${status(n)}`}
 const level=n=>/^COORDINADOR/.test(n.category)?' level-coord':/^(ANALISTA|ESPECIALISTA|ASISTENTE|PASANTE)/.test(n.category)?' level-analyst':'';
 function entry(n){return `<button class="card entry${level(n)}" type="button" data-enter="${n.id}" data-card="${n.id}" aria-label="Ingresar a ${escape(title(n))}">${content(n)}<span class="entry-action">Ver equipo ${enterIcon}</span></button>`}
 function tree(n,isRoot=false){const expandable=n.children.length>0,open=isRoot||openPath.includes(n.id),interactive=expandable&&!isRoot,tag=interactive?'button':'div';
 return `<div class="tree-node"><${tag} class="card ${isRoot?'detail-root':interactive?'toggle-card':''}" data-card="${n.id}" ${interactive?`type="button" data-toggle="${n.id}" aria-expanded="${open}" aria-controls="children-${n.id}" aria-label="${open?'Contraer':'Desplegar'} ${escape(title(n))}"`:'tabindex="-1"'}>${content(n)}${n.notes?`<span class="note">${escape(n.notes)}</span>`:''}${interactive?`<span class="count">${n.children.length} ${n.children.length===1?'reporte directo':'reportes directos'}</span>${chevron}`:''}</${tag}>${expandable?`<div class="children" id="children-${n.id}" ${open?'':'hidden'}>${n.children.map(c=>tree(c)).join('')}</div>`:isRoot?'<p class="empty">Sin reportes directos</p>':''}</div>`}
 function render(restore){stage.classList.toggle('focused',!!focus);
 stage.innerHTML='<svg class="connectors" aria-hidden="true"></svg>'+(focus?tree(nodes.get(focus),true):`<div class="leadership"><div class="card leader vision" data-card="${root.id}">${content(root)}</div><div class="card leader general" data-card="${general.id}">${content(general)}</div></div><div class="overview-row">${branches.map(entry).join('')}</div>`);
 document.getElementById('overview').hidden=!focus;document.getElementById('view-label').textContent=focus?title(nodes.get(focus)):'Gerencia General y equipos';
 document.getElementById('hint').textContent=focus?(nodes.get(focus).children.some(n=>n.children.length)?'Selecciona un nodo para desplegarlo. Al abrir otra rama, la anterior se contrae.':''):'Selecciona un equipo para ingresar.';
 fit();if(restore)stage.querySelector(`[data-toggle="${restore}"]`)?.focus({preventScroll:true});
 }
 function fit(){if(!stage.firstElementChild)return;stage.style.transform='none';const base=stage.getBoundingClientRect(),cards=new Map();
 stage.querySelectorAll('[data-card]').forEach(el=>{if(!el.closest('[hidden]')){const r=el.getBoundingClientRect();cards.set(el.dataset.card,{x:r.left-base.left+r.width/2,y:r.top-base.top,bottom:r.bottom-base.top})}});
 let paths='';cards.forEach((r,id)=>{const children=nodes.get(id).children.filter(c=>cards.has(c.id));if(!children.length)return;const ends=children.map(c=>cards.get(c.id));const bus=r.bottom+(Math.min(...ends.map(c=>c.y))-r.bottom)/2;
 paths+=`<path d="M${r.x},${r.bottom}V${bus}M${Math.min(r.x,...ends.map(c=>c.x))},${bus}H${Math.max(r.x,...ends.map(c=>c.x))}"/>`;
 children.forEach(c=>{const end=cards.get(c.id);paths+=`<path d="M${end.x},${bus}V${end.y}" ${c.lineType==='dotted'?'stroke-dasharray="3 4"':''}/>`})});stage.querySelector('.connectors').innerHTML=paths;
 const w=stage.offsetWidth,h=stage.offsetHeight,hint=document.getElementById('hint'),reserve=hint.textContent?hint.offsetHeight+22:10;
 const scale=Math.max(.001,Math.min((viewport.clientWidth-16)/w,(viewport.clientHeight-reserve-12)/h,1.18));
 const x=Math.max(0,(viewport.clientWidth-w*scale)/2),y=Math.max(6,Math.min(32,(viewport.clientHeight-reserve-h*scale)/3));stage.style.transform=`translate(${x}px,${y}px) scale(${scale})`;
 }
 stage.addEventListener('click',e=>{const enter=e.target.closest('[data-enter]'),toggle=e.target.closest('[data-toggle]');
 if(enter){focus=enter.dataset.enter;openPath=[];render();stage.querySelector('.detail-root').focus({preventScroll:true})}
 else if(toggle&&focus){const id=toggle.dataset.toggle,at=openPath.indexOf(id);openPath=at>=0?openPath.slice(0,at):pathTo(id);render(id)}});
 function overview(){const previous=focus;focus=null;openPath=[];render();if(previous)stage.querySelector(`[data-enter="${previous}"]`)?.focus({preventScroll:true})}
 document.getElementById('overview').addEventListener('click',overview);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&focus)overview()});
 let toastTimer;
 document.getElementById('save').addEventListener('click',()=>{const snapshot=document.documentElement.cloneNode(true);snapshot.querySelector('#stage').innerHTML='';snapshot.querySelector('#stage').removeAttribute('style');snapshot.querySelector('#view-state').textContent=JSON.stringify({focus,openPath});snapshot.querySelector('#toast').hidden=true;
 const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+snapshot.outerHTML],{type:'text/html;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='Organigrama_Kaizen_Proyectado.html';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);const toast=document.getElementById('toast');toast.textContent='Vista guardada en un nuevo archivo HTML.';toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,3500)});
 new ResizeObserver(fit).observe(viewport);window.addEventListener('beforeprint',fit);window.addEventListener('afterprint',fit);document.fonts?.ready.then(fit);render();
})();
